name: Monthly catalog refresh

on:
  schedule:
    - cron: "17 6 3 * *"      # 06:17 UTC on the 3rd of every month
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Re-crawl mattymctech.com and refresh catalog.json
        run: python update_catalog.py
      - name: Commit if the catalog changed
        run: |
          cp catalog.json docs/catalog.json   # offline snapshot bundled in the iPhone/web app
          if git diff --quiet -- catalog.json android/app/src/main/assets/catalog.json docs/catalog.json; then
            echo "No new tools this month."
          else
            git config user.name "catalog-bot"
            git config user.email "catalog-bot@users.noreply.github.com"
            git add catalog.json android/app/src/main/assets/catalog.json docs/catalog.json
            git commit -m "Monthly catalog refresh"
            git push
          fi
