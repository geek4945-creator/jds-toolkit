name: Nightly politician-trades refresh

on:
  schedule:
    - cron: "41 7 * * *"      # 07:41 UTC every day (about midnight US Pacific)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: trades-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install poppler (pdftotext reads the House PDFs)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: Rebuild trades.json from public STOCK Act filings (no API keys)
        run: python update_trades.py
      - name: Commit if the data changed
        run: |
          if git diff --quiet -- trades.json docs/trades.json android/app/src/main/assets/trades.json; then
            echo "No new filings."
          else
            git config user.name "trades-bot"
            git config user.email "trades-bot@users.noreply.github.com"
            git pull --rebase -q origin main || true
            git add trades.json docs/trades.json android/app/src/main/assets/trades.json
            git commit -m "Nightly politician-trades refresh"
            git push
          fi
